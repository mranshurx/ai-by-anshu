<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Chat UI</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f9f9f9; }
        #chat-box { background: white; border: 1px solid #ccc; padding: 20px; height: 400px; overflow-y: scroll; margin-bottom: 20px; border-radius: 8px; }
        input, button { padding: 10px; font-size: 16px; }
        input[type="text"] { width: 70%; }
        .message { margin-bottom: 10px; }
        .user { color: blue; }
        .ai { color: green; }
    </style>
</head>
<body>

    <h2>💬 Unrestricted Free AI Chat UI</h2>
    <div>
        <label>API Key:</label>
        <input type="password" id="apiKey" placeholder="Enter Gemini API Key">
    </div>
    <div id="chat-box"></div>
    <input type="text" id="userInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value;
            const userInput = document.getElementById('userInput').value;
            const chatBox = document.getElementById('chat-box');

            if (!apiKey || !userInput) {
                alert("Please enter both an API key and a message!");
                return;
            }

            chatBox.innerHTML += `<div class="message user"><b>You:</b> ${userInput}</div>`;
            document.getElementById('userInput').value = '';

            try {
                // Call Gemini API directly from the browser
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userInput }] }]
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;

                chatBox.innerHTML += `<div class="message ai"><b>AI:</b> ${aiText}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (error) {
                chatBox.innerHTML += `<div class="message ai" style="color:red;">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
