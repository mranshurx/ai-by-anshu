<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Free AI Web UI</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #6366f1;
            --border-color: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }
        /* Sidebar Styles */
        aside {
            width: 280px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        aside h2 { font-size: 1.2rem; margin-top: 0; color: #fff; }
        label { font-size: 0.85rem; color: #aaa; }
        input[type="password"], select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        /* Main Chat Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 1.1rem;
        }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: var(--accent-color);
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #2a2a2a;
            color: var(--text-color);
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }
        /* Input Footer */
        .input-area {
            padding: 20px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            padding: 0 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <!-- Sidebar Configuration -->
    <aside>
        <h2>⚡ Settings</h2>
        <div>
            <label>OpenRouter API Key:</label>
            <input type="password" id="apiKey" placeholder="sk-or-v1-...">
        </div>
        <div>
            <label>Select Free Model:</label>
            <select id="modelSelect">
                <option value="openrouter/free">Auto Free Router</option>
                <option value="qwen/qwen3.8-27b:free">Qwen 2.7B / Free</option>
                <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Free)</option>
            </select>
        </div>
        <p style="font-size: 0.8rem; color: #777; margin-top: auto;">
            Get a free key at <a href="https://openrouter.ai/keys" target="_blank" style="color: var(--accent-color);">openrouter.ai</a>
        </p>
    </aside>

    <!-- Main Chat Window -->
    <main>
        <header>OpenRouter Free AI Web UI</header>
        
        <div id="chat-container">
            <div class="message ai-message">Hello! Enter your OpenRouter API key on the left sidebar and type a message below to start.</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message here..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chat-container');
        let messageHistory = [];

        async function sendMessage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('modelSelect').value;
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();

            if (!apiKey) {
                alert("Please enter your OpenRouter API key in the sidebar!");
                return;
            }
            if (!userText) return;

            // Append User Message to UI & History
            appendMessage(userText, 'user-message');
            messageHistory.push({ role: "user", content: userText });
            inputField.value = "";

            // Create placeholder for AI response
            const aiMessageDiv = appendMessage("Thinking...", 'ai-message');

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "HTTP-Referer": window.location.origin,
                        "X-Title": "OpenRouter HTML UI",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: messageHistory
                    })
                });

                const data = await response.json();

                if (data.error) {
                    aiMessageDiv.textContent = `Error: ${data.error.message}`;
                    return;
                }

                const aiReply = data.choices[0].message.content;
                aiMessageDiv.textContent = aiReply;
